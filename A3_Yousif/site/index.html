<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Montreal Playgrounds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Leaflet: the map library. Loaded from the internet, nothing to install. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-intro">
      <h1>Montréal Playgrounds</h1>
      <p>Explore playgrounds by borough and compare nearby tree-canopy coverage.</p>
    </div>
    <div class="header-controls">
      <div class="borough-control">
        <label for="borough-filter">Borough</label>
        <select id="borough-filter" disabled>
          <option value="">All boroughs</option>
        </select>
      </div>
      <p id="status" role="status">Loading playgrounds...</p>
    </div>
    <p class="source">Source: Ville de Montréal — Installations récréatives, sportives et culturelles extérieures, CC BY 4.0.</p>
  </header>
  <div id="content">
    <div id="map"></div>
    <aside id="ranking-panel" aria-live="polite">
      <h2>Greenest playground surroundings</h2>
      <p id="ranking-summary">Loading rankings...</p>
      <ol id="ranking-list"></ol>
    </aside>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
